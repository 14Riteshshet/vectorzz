name: SookshmaJal CI — Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.8.4

      - name: Lint backend
        run: ruff check backend/ tests/ --select=E,W,F,I,B,UP --ignore=E501

      - name: Format check
        run: ruff format --check backend/ tests/

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Pytest Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      # Optional: uncomment to run against a real Postgres in CI
      # postgres:
      #   image: postgres:16-alpine
      #   env: { POSTGRES_DB: sookshmajal, POSTGRES_USER: sj, POSTGRES_PASSWORD: sj }
      #   ports: ['5432:5432']
      #   options: >-
      #     --health-cmd pg_isready --health-interval 10s
      #     --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system GDAL (for rasterio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin python3-gdal

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest==8.3.4 pytest-anyio==0.0.0 anyio==4.7.0 httpx==0.28.1

      - name: Create .env for tests
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=sqlite+aiosqlite:///./test_sookshmajal.db
          SARVAM_API_KEY=
          ALLOWED_ORIGINS=http://localhost:8000
          APP_ENV=testing
          EOF

      - name: Create fallback cache dir
        run: |
          mkdir -p fallback_cache generated_pdfs
          cp fallback_cache/*.json fallback_cache/ 2>/dev/null || true

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_sookshmajal.db
          SARVAM_API_KEY: ""
          ALLOWED_ORIGINS: "http://localhost:8000"
          APP_ENV: testing
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            -p no:warnings

      - name: Cleanup test DB
        if: always()
        run: rm -f test_sookshmajal.db

  # ── Build Docker image ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sookshmajal:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
